name: Build TrollStore Mod

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install ldid

      - name: Install Theos
        uses: theos/theos-action@main

      - name: Build packages
        run: make package FINALPACKAGE=1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TrollStore-mod-build
          path: |
            _build/*.tar
            _build/*.ipa
            TrollHelper/packages/*.deb
            TrollStoreLite/packages/*.deb
          if-no-files-found: warn
